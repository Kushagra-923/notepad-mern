services:
  - type: web
    name: notepad
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: npm start
    healthCheckPath: /api/auth/config
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL    # Postgres connection string (Neon free tier)
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
