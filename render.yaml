services:
  - type: web
    name: notepad
    runtime: node
    plan: starter            # persistent disks need a paid plan
    buildCommand: npm install && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: npm start
    healthCheckPath: /api/auth/config
    envVars:
      - key: NODE_VERSION    # node:sqlite needs Node 22.5+
        value: 24
      - key: JWT_SECRET
        generateValue: true
      - key: DB_FILE
        value: /var/data/notes.db
      - key: GOOGLE_CLIENT_ID
        sync: false
    disk:
      name: notes-data
      mountPath: /var/data
      sizeGB: 1
